services:
  # ── RH / Nominas ──────────────────────────────────────────
  openwebui-rh:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui-rh
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      - /mnt/data/docker-volumes/rh:/app/backend/data
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    environment:
      - WEBUI_NAME=RH / Nominas
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY_RH}
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_API_KEY=${GROQ_API_KEY_RH}
      - OLLAMA_BASE_URL=http://172.18.0.1:11434
      - AIOHTTP_CLIENT_TIMEOUT=300

  # ── Calidad ───────────────────────────────────────────────
  openwebui-calidad:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui-calidad
    restart: unless-stopped
