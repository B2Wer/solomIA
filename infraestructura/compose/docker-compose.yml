  # ── I&D ───────────────────────────────────────────────────
  openwebui-id:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui-id
    restart: unless-stopped
    ports:
      - "3004:8080"
    volumes:
      - /mnt/data/docker-volumes/id:/app/backend/data
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    environment:
      - WEBUI_NAME=I&D
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY_ID}
      - ENABLE_OLLAMA_API=false
