  # ── PostgreSQL ────────────────────────────────────────────
  postgresql:
    image: postgres:16
    container_name: solomia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - /mnt/data/docker-volumes/postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
